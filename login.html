<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Potential Blood Donor</title>

    <!-- Separate CSS -->
    <link rel="stylesheet" href="lstyle.css">
</head>

<body>

    <div class="page">

        <div class="login-card">

            <!-- Header -->
            <header class="header">
                <h3>
                    <span class="blood-drop">♦</span>
                    Potential Blood Donor
                </h3>

                <p>Login to your account!</p>
            </header>


            <!-- Login Content -->
            <main class="login-content">

                <h1>
                    Welcome <span>Back!</span>
                </h1>

                <p class="description">
                    Please login to continue and access your
                    donor account.
                </p>


                <!-- Login Form -->
                <form action="#" method="post">

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="forgot">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="button"
                        class="login-btn"
                        onclick="window.location.href='profile.html'">
                        Login
                        </button>

                </form>


                <div class="register">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </div>

            </main>


            <!-- Footer -->
            <footer>
                <p>
                    <span>1.</span> Register
                    <b>────────</b>
                    <span>2.</span> Complete Profile
                </p>

                <p>
                    <span>3.</span> Verification
                    <b>────────</b>
                    <span>4.</span> Ready
                </p>
            </footer>

        </div>

    </div>

</body>
</html>
