<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Potential Blood Donor</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="fpassword.css">
</head>

<body>

    <div class="container">

        <!-- Header / Branding -->
        <div class="brand">

            <div class="logo">
                <span class="blood-drop"></span>

                <h2>Potential Blood Donor</h2>
            </div>

            <p class="system-name">
                Gathering System
            </p>

        </div>


        <!-- Forgot Password Section -->
        <div class="forgot-card">

            <h1>
                Forgot <span>Password?</span>
            </h1>

            <p class="description">
                Don't worry! Enter your registered email address
                and we'll help you reset your password.
            </p>


            <!-- Form -->
            <form action="#" method="POST">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <button type="submit">
                    Send Reset Link
                </button>

            </form>


            <!-- Back to Login -->
            <p class="back-login">
                Remember your password?
                <a href="login.html">
                    Back to Login
                </a>
            </p>

        </div>

    </div>

</body>
</html>
